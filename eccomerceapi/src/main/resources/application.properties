# ./eccomerceapi/src/main/resources/application.properties
spring.application.name=eccomerceapi

# Configuración de PostgreSQL (Usa "postgres" como host si corre en Docker, o "localhost" si ejecutas Spring Boot directo en tu máquina)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ecommerce_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------
# JPA & Hibernate Configuration
# ----------------------------

# Prevents Hibernate from creating or modifying the database schema.
# Validates that the schema matches the entity mappings.
# Recommended when Flyway fully manages schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Logs all SQL statements executed by Hibernate.
# Useful for debugging and development visibility.
spring.jpa.show-sql=true

# Specifies the SQL dialect Hibernate should use.
# Ensures compatibility with PostgreSQL-specific SQL syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formats SQL queries in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true


# ----------------------------
# Flyway Configuration
# ----------------------------

# Enables Flyway database migrations at application startup.
# Explicit for clarity, even though the Flyway starter enables it by default.
spring.flyway.enabled=true

# Location where Flyway looks for migration scripts.
# By convention: src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration

# ----------------------------
# Database Driver Configuration
# ----------------------------

# Configures the JDBC driver class for PostgreSQL.
# Must match the version of PostgreSQL being used.
spring.datasource.driver-class-name=org.postgresql.Driver

# DEBUG temporal: reporte completo de auto-configuración de Spring Boot
debug=true
# Opcional: Útil si quieres ver los logs de transacciones o usar Flyway en el futuro
# spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl